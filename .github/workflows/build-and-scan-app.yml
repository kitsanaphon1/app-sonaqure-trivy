name: Build & Scan App Image

on:
  push:
    branches: [dev]

permissions:
  contents: read
  security-events: write

jobs:
  analyze-and-scan:
    runs-on: ubuntu-latest
    environment:
      name: docker-publish

    steps:
      - name: Checkout Code
        uses: actions/checkout@v3

      - name: Setup .NET
        uses: actions/setup-dotnet@v3
        with:
          dotnet-version: '9.0.x'

      - name: Install SonarScanner for .NET
        run: dotnet tool install --global dotnet-sonarscanner

      - name: Begin SonarCloud Analysis
        env:
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
        run: |
          dotnet-sonarscanner begin /k:"${{ secrets.SONAR_PROJECT_KEY }}" \
            /o:"${{ secrets.SONAR_ORGANIZATION }}" \
            /d:sonar.login="${{ secrets.SONAR_TOKEN }}"
            /d:sonar.branch.name=dev

      - name: Restore and Build
        run: |
          dotnet restore WebAppProject/WebAppProject.csproj
          dotnet build WebAppProject/WebAppProject.csproj --no-restore --configuration Release

      - name: End SonarCloud Analysis
        env:
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
        run: |
          dotnet-sonarscanner end /d:sonar.login="${{ secrets.SONAR_TOKEN }}"

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Login to Docker Hub
        uses: docker/login-action@v2
        with:
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_PASSWORD }}

      - name: Build Docker Image (app-pass)
        run: docker build -t app-pass:latest -f WebAppProject/Dockerfile WebAppProject

      - name: Scan with Trivy (SARIF for GitHub Dashboard)
        uses: aquasecurity/trivy-action@master
        with:
          image-ref: 'app-pass:latest'
          format: 'sarif'
          output: 'trivy-results.sarif'

      - name: Upload Trivy Scan to GitHub Dashboard
        uses: github/codeql-action/upload-sarif@v3
        with:
          sarif_file: trivy-results.sarif

      - name: ❗ Fail if CRITICAL vulnerabilities found
        run: |
          trivy image --severity CRITICAL --exit-code 1 --no-progress app-pass:latest

      - name: ⬆️ Push Docker Image
        if: ${{ success() }}
        run: |
          docker tag app-pass:latest sooyaa02/app-pass:latest
          docker push sooyaa02/app-pass:latest

      - name: Send Email Notification
        if: ${{ success() }}
        uses: dawidd6/action-send-mail@v3
        with:
          server_address: smtp.gmail.com
          server_port: 465
          username: ${{ secrets.MAIL_USERNAME }}
          password: ${{ secrets.MAIL_PASSWORD }}
          subject: "✅ App CI/CD Pipeline Succeeded"
          to: chol.www02@gmail.com
          from: GitHub CI <${{ secrets.MAIL_USERNAME }}>
          body: |
            ✅ App pipeline completed successfully.
            - Docker image: sooyaa02/app-pass:latest
            - Trivy scan: ✅ No CRITICAL vulnerabilities
            - SonarCloud scan: ✅ Done
